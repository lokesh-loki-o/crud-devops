# Optional autoscaling. Not part of the 1-replica baseline: apply it separately.
# Requires the metrics-server addon (minikube addons enable metrics-server).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crud-web
  namespace: crud-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crud-web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    # 70% of the 500m CPU request = scale out above 350m average per pod.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
