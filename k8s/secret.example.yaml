# Example only: the real Secret is never committed. Create it from your .env:
#   kubectl -n crud-app create secret generic crud-secrets --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: crud-secrets
  namespace: crud-app
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-me
  DB_USERNAME: crud_app
  DB_PASSWORD: change-me
  RAILS_MASTER_KEY: change-me
