# MySQL configuration

default: &default
  adapter: mysql2
  encoding: utf8mb4
  # One connection per Puma thread (see config/puma.rb)
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 3 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "root" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "devpassword123" } %>
  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>
  port: 3306

development:
  <<: *default
  database: crud_devops_project_development

test:
  <<: *default
  database: crud_devops_project_test

production:
  <<: *default
  database: crud_devops_project_production
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV.fetch("DB_HOST") { "crud-mysql" } %>
